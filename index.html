<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى هني.. حبيبتي</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri&family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #000; font-family: 'Reem Kufi', sans-serif;
        }

        .bg-overlay {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #500 0%, #000 100%);
            z-index: -1;
        }

        .container {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; height: 100vh; text-align: center;
        }

        .glass-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(25px);
            padding: 50px; border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 50px rgba(255, 0, 85, 0.4);
            z-index: 10;
        }

        .name {
            font-size: clamp(3.5rem, 12vw, 6.5rem);
            background: linear-gradient(45deg, #ff0055, #ffcc00, #ff0055);
            background-size: 200% auto;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: flow 3s linear infinite;
            filter: drop-shadow(0 0 15px rgba(255, 0, 85, 0.3));
        }

        @keyframes flow { to { background-position: 200% center; } }

        .btn-play {
            background: #ff0055; color: white; border: none;
            padding: 20px 50px; border-radius: 50px;
            font-size: 1.6rem; cursor: pointer;
            font-family: 'Reem Kufi', sans-serif;
            margin-top: 30px;
            box-shadow: 0 10px 30px rgba(255, 0, 85, 0.6);
            transition: 0.3s;
        }

        .btn-play:hover { transform: scale(1.1); background: #ff4488; }

        .heart {
            position: absolute; pointer-events: none;
            animation: float linear forwards;
            filter: drop-shadow(0 0 5px rgba(255, 50, 100, 0.8));
        }

        @keyframes float {
            from { transform: translateY(110vh) rotate(0deg); opacity: 1; }
            to { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <audio id="loveSong">
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <div class="bg-overlay"></div>

    <div class="container">
        <div class="glass-box">
            <div style="font-size: 5rem; margin-bottom: 15px;">❤️</div>
            <h1 class="name">أحبك هني</h1>
            <p id="msg" style="color: #fff; font-family: 'Amiri', serif; font-size: 1.8rem; opacity: 0.9;">
                أنتِ أغلى ما أملك
            </p>
            <button class="btn-play" id="btn" onclick="startExperience()">اضغطي هنا يا هني ✨</button>
        </div>
    </div>

    <script>
        function startExperience() {
            const song = document.getElementById('loveSong');
            const btn = document.getElementById('btn');
            const msg = document.getElementById('msg');
            
            song.play().catch(e => {
                alert("تأكد أن ملف الأغنية اسمه song.mp3 وموجود في نفس المجلد!");
            });

            btn.style.display = 'none';
            msg.innerText = "هذه الأغنية لكِ يا حبيبتي..";
            
            setInterval(createHeart, 150);
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            const icons = ['❤️', '💖', '💗', '💕', '✨'];
            heart.innerHTML = icons[Math.floor(Math.random() * icons.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.random() * 25 + 15) + 'px';
            heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }
    </script>
</body>
</html>
